<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>404 — Page Not Found — StudySaathi v3</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        justify-content: center;
        align-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
      }
      .error-page {
        text-align: center;
        padding: 40px 20px;
        max-width: 600px;
      }
      .error-code {
        font-family: "Syne", sans-serif;
        font-size: clamp(6rem, 15vw, 12rem);
        font-weight: 800;
        color: var(--teal);
        line-height: 1;
        margin-bottom: 16px;
      }
      .error-title {
        font-size: clamp(1.5rem, 4vw, 2rem);
        color: var(--text);
        margin-bottom: 8px;
      }
      .error-subtitle {
        color: var(--text2);
        font-size: 1rem;
        margin-bottom: 32px;
      }
      .btn-teal {
        background: var(--teal);
        color: var(--ink);
        padding: 12px 24px;
        border-radius: var(--r);
        font-weight: 600;
        transition: 0.2s;
      }
      .btn-teal:hover {
        background: var(--teal2);
        transform: translateY(-1px);
      }
    </style>
</head>
  <body>
    <div class="error-page">
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-subtitle">The page you're looking for doesn't exist.</p>
      <a href="index.html" class="btn btn-teal">Go Home</a>
    </div>
  </body>
</html>
